<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JamSounds — Tailored music for your projects</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M3 12h2l3-9 4 18 3-9 2 4h4"/></svg>
      </div>
      <div>
        <h1>JamSounds <span class="brand-sub">studio</span></h1>
      </div>
    </div>
    <div class="status">
      <span id="credits-pill" class="pill">— credits</span>
      <span id="tracks-pill" class="pill">— saved</span>
    </div>
  </header>

  <main class="layout">
    <section class="panel">
      <p class="section-label">Project brief <span class="optional">— optional</span></p>
      <textarea id="project-brief" rows="3" placeholder="Describe the project this music is for. For example: 'A meditation app for dog walkers — calming background music designed to loop while users track their walks.'"></textarea>
      <button id="translate-btn" class="btn-secondary">
        <span class="btn-icon">✨</span>
        Fill fields with Claude
      </button>
      <p id="translate-status" class="status-line"></p>

      <div class="divider"></div>

      <p class="section-label">Music brief</p>

      <div class="grid-2">
        <div class="field">
          <label for="title">Title</label>
          <input id="title" type="text" maxlength="100" placeholder="Untitled" />
        </div>
        <div class="field">
          <label for="model">Model</label>
          <select id="model">
            <option value="V5_5">V5_5 — newest</option>
            <option value="V5">V5</option>
            <option value="V4_5PLUS">V4.5 Plus</option>
            <option value="V4_5ALL">V4.5 All</option>
            <option value="V4_5">V4.5</option>
            <option value="V4">V4</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="style">Style</label>
        <input id="style" type="text" maxlength="1000" placeholder="ambient electronic, lo-fi, warm pads, 80 BPM" />
      </div>

      <div class="field">
        <label for="prompt">Lyrics / prompt</label>
        <textarea id="prompt" rows="3" maxlength="5000" placeholder="Lyrics if vocal, or descriptive guidance if instrumental"></textarea>
      </div>

      <div class="grid-2">
        <div class="field">
          <label for="instrumental">Instrumental</label>
          <select id="instrumental">
            <option value="true">Yes (no vocals)</option>
            <option value="false">No (with vocals)</option>
          </select>
        </div>
        <div class="field">
          <label for="negative-tags">Avoid (negative tags)</label>
          <input id="negative-tags" type="text" placeholder="heavy metal, vocals" />
        </div>
      </div>

      <details class="advanced">
        <summary>Advanced (weights, vocal gender, persona)</summary>
        <div class="grid-3">
          <div class="field">
            <label for="style-weight">Style wt</label>
            <input id="style-weight" type="number" step="0.05" min="0" max="1" value="0.65" />
          </div>
          <div class="field">
            <label for="weirdness">Weirdness</label>
            <input id="weirdness" type="number" step="0.05" min="0" max="1" value="0.5" />
          </div>
          <div class="field">
            <label for="audio-weight">Audio wt</label>
            <input id="audio-weight" type="number" step="0.05" min="0" max="1" value="0.65" />
          </div>
        </div>
        <div class="field">
          <label for="vocal-gender">Vocal gender</label>
          <select id="vocal-gender">
            <option value="">n/a</option>
            <option value="f">Female</option>
            <option value="m">Male</option>
          </select>
        </div>
      </details>

      <button id="generate-btn" class="btn-primary">
        <span class="btn-icon">▶</span>
        <span id="generate-label">Generate · ~8 credits</span>
      </button>
      <p id="generate-status" class="status-line"></p>
    </section>

    <section class="results">
      <div class="panel">
        <p class="section-label">Now playing</p>
        <div id="player-empty" class="empty">
          <p>Generate a track to start.</p>
          <p class="hint">Suno returns 2 versions per generation. Click v1 / v2 to switch.</p>
        </div>
        <div id="player" class="player hidden">
          <p id="player-title" class="player-title">—</p>
          <p id="player-meta" class="player-meta">—</p>
          <audio id="audio-el" controls preload="metadata"></audio>
          <div class="player-actions">
            <button class="version-btn active" data-version="0">v1</button>
            <button class="version-btn" data-version="1">v2</button>
            <button id="save-btn" class="icon-btn" title="Save to library">♡</button>
            <a id="download-link" class="icon-btn" title="Download" download>↓</a>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="library-header">
          <p class="section-label" style="margin: 0;">Library</p>
          <span id="library-count" class="hint">—</span>
        </div>
        <div id="library-list" class="library-list">
          <p class="empty-hint">No saved tracks yet.</p>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
